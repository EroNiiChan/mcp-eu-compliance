[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-eu-compliance"
version = "1.0.0"
description = "Zero-dependency EU AI Act Auditor & Factur-X / EN 16931 Electronic Invoicing MCP Server for Claude Desktop, Cursor & Antigravity."
readme = "README.md"
authors = [
    { name = "EroNiiChan" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Accounting",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
keywords = [
    "mcp", "model-context-protocol", "claude-desktop", "cursor", "antigravity",
    "eu-ai-act", "factur-x", "en16931", "electronic-invoicing", "gdpr", "nis2", "compliance"
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mcp-eu-compliance = "mcp_eu_compliance:main"

[project.urls]
Homepage = "https://github.com/EroNiiChan/mcp-eu-compliance"
Repository = "https://github.com/EroNiiChan/mcp-eu-compliance"
Issues = "https://github.com/EroNiiChan/mcp-eu-compliance/issues"
Funding = "https://github.com/sponsors/EroNiiChan"
